<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elena Voss & Vexra - Dos Almas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .player-container {
            max-width: 600px;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 165, 116, 0.2);
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .album-info {
            text-align: center;
            margin-bottom: 2rem;
        }

        .album-title {
            font-size: 2rem;
            font-weight: 700;
            color: #d4a574;
            margin-bottom: 0.5rem;
            font-family: 'Merriweather', serif;
        }

        .artist-name {
            font-size: 1.3rem;
            color: rgba(212, 165, 116, 0.8);
            margin-bottom: 0.5rem;
        }

        .album-meta {
            font-size: 0.9rem;
            color: rgba(212, 165, 116, 0.6);
        }

        .tracklist {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .track {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1rem;
            align-items: center;
            padding: 0.75rem;
            background: rgba(212, 165, 116, 0.05);
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .track:hover {
            background: rgba(212, 165, 116, 0.1);
        }

        .track.playing {
            background: rgba(212, 165, 116, 0.15);
            border: 1px solid rgba(212, 165, 116, 0.3);
        }

        .track-number {
            color: rgba(212, 165, 116, 0.6);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .track-title {
            color: #e0e0e0;
            font-size: 0.95rem;
        }

        .track-play {
            background: none;
            border: none;
            color: #d4a574;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.25rem;
            transition: transform 0.2s;
        }

        .track-play:hover {
            transform: scale(1.2);
        }

        .player {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(212, 165, 116, 0.1);
        }

        .current-track {
            text-align: center;
            margin-bottom: 1rem;
            color: #d4a574;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .control-btn {
            background: none;
            border: none;
            color: #d4a574;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: all 0.2s;
        }

        .control-btn:hover {
            color: #e0c097;
            transform: scale(1.1);
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(212, 165, 116, 0.2);
            border-radius: 3px;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #d4a574, #e0c097);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: rgba(212, 165, 116, 0.6);
        }

        @media (max-width: 768px) {
            .player-container {
                padding: 1.5rem;
            }

            .album-title {
                font-size: 1.5rem;
            }

            .artist-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <img src="assets/images/elena-vexra-dos-almas.png" alt="Dos Almas" class="album-art">

        <div class="album-info">
            <div class="album-title">Dos Almas</div>
            <div class="artist-name">Elena Voss & Vexra</div>
            <div class="album-meta">Electronic • Bilingual • 2026 • 13 Tracks</div>
        </div>

        <div class="tracklist">
            <div class="track" data-track="elena-voss-dos-almas/01_Dos_Almas.mp3" data-title="Dos_Almas">
                <span class="track-number">01</span>
                <span class="track-title">Dos_Almas</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/02_Colision.mp3" data-title="Colision">
                <span class="track-number">02</span>
                <span class="track-title">Colision</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/03_Veneno_Dulce.mp3" data-title="Veneno_Dulce">
                <span class="track-number">03</span>
                <span class="track-title">Veneno_Dulce</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/04_Donde_Estas.mp3" data-title="Donde_Estas">
                <span class="track-number">04</span>
                <span class="track-title">Donde_Estas</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/05_Guerra_Santa.mp3" data-title="Guerra_Santa">
                <span class="track-number">05</span>
                <span class="track-title">Guerra_Santa</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/06_Cerca.mp3" data-title="Cerca">
                <span class="track-number">06</span>
                <span class="track-title">Cerca</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/07_Tu_Voz.mp3" data-title="Tu_Voz">
                <span class="track-number">07</span>
                <span class="track-title">Tu_Voz</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/08_Gravedad.mp3" data-title="Gravedad">
                <span class="track-number">08</span>
                <span class="track-title">Gravedad</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/09_Ultima_Noche.mp3" data-title="Ultima_Noche">
                <span class="track-number">09</span>
                <span class="track-title">Ultima_Noche</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/10_Espejismo.mp3" data-title="Espejismo">
                <span class="track-number">10</span>
                <span class="track-title">Espejismo</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/11_Mareas.mp3" data-title="Mareas">
                <span class="track-number">11</span>
                <span class="track-title">Mareas</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/12_Amanecer.mp3" data-title="Amanecer">
                <span class="track-number">12</span>
                <span class="track-title">Amanecer</span>
                <button class="track-play">▶</button>
            </div>
            <div class="track" data-track="elena-voss-dos-almas/13_Eterna.mp3" data-title="Eterna">
                <span class="track-number">13</span>
                <span class="track-title">Eterna</span>
                <button class="track-play">▶</button>
            </div>
        </div>

        <div class="player">
            <div class="current-track" id="currentTrack">Select a track</div>
            <div class="controls">
                <button class="control-btn" id="prevBtn">⏮</button>
                <button class="control-btn" id="playPauseBtn">▶</button>
                <button class="control-btn" id="nextBtn">⏭</button>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <audio id="audioPlayer"></audio>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTime = document.getElementById('currentTime');
        const duration = document.getElementById('duration');
        const currentTrack = document.getElementById('currentTrack');
        const tracks = document.querySelectorAll('.track');

        let currentIndex = 0;

        tracks.forEach((track, index) => {
            track.addEventListener('click', () => {
                currentIndex = index;
                loadTrack(currentIndex);
                audio.play();
            });
        });

        function loadTrack(index) {
            const track = tracks[index];
            const filename = track.dataset.track;
            const title = track.dataset.title;

            audio.src = `assets/audio/${filename}`;
            currentTrack.textContent = title;

            tracks.forEach(t => t.classList.remove('playing'));
            track.classList.add('playing');

            playPauseBtn.textContent = '⏸';
        }

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                if (!audio.src) {
                    loadTrack(0);
                }
                audio.play();
                playPauseBtn.textContent = '⏸';
            } else {
                audio.pause();
                playPauseBtn.textContent = '▶';
            }
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentIndex);
            audio.play();
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % tracks.length;
            loadTrack(currentIndex);
            audio.play();
        });

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = progress + '%';
            currentTime.textContent = formatTime(audio.currentTime);
            duration.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            nextBtn.click();
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }
    </script>
</body>
</html>
